<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CACO Potion Builder</title>
    <link rel="stylesheet" href="stylesheet-main.css">
</head>
<body>
 <div id="app">
    <header>
        <h1>CACO Potion Builder</h1>
    </header>

    <main>
        <!-- This container handles the parchment background and layout -->
        <section class="search-bar-container">
            <div class="search-bar-flex">
                <input type="text" id="ingredient-search-field" placeholder="Search by name...">
                <datalist id="ingredient-search-suggestions"></datalist>
            </div>

            <div class="filters-flex">
                <select id="ingredient-effects-dropdown-01"></select>
                <select id="ingredient-effects-dropdown-02"></select>
                <select id="ingredient-effects-dropdown-03"></select>
                <select id="ingredient-effects-dropdown-04"></select>
            </div>

            <div class="toggles-flex">
                <label><input type="checkbox" id="show-bruma-ingredients" checked> Beyond Sky. Bruma</label>
                <label><input type="checkbox" id="show-hunterborn-ingredients" checked> Hunterborn</label>
            </div>
        </section>

        <!-- The area where the potion result appears -->
        <section id="brewing-preview"></section>

        <!-- The grid of ingredients -->
        <section id="ingredient-search-results"></section>
    </main>

    <footer>
        <div id="themes-list">
            <!-- Theme buttons go here -->
        </div>
        <div class="version-info">
            <span id="ussep-version"><a></a></span>
            <span id="caco-version"><a></a></span>
            <span id="bs-cyrodiil-version"><a></a></span>
            <span id="hunterborn-version"><a></a></span>
        </div>
    </footer>
</div>
</body>
</html>
